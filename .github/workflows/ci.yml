name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.6.17"

      - name: Install the project (fails if uv.lock does not match pyproject.toml)
        run: uv sync --locked

      # Tests run in a new network namespace with only loopback, so no test and
      # no subprocess can open a network connection. Unix sockets with a file
      # path are not cut off by a namespace.
      - name: Tests with no network
        run: |
          sudo unshare --net -- sh -c '
            ip link set lo up &&
            sudo -u "$0" env "PATH=$1" "HOME=$2" "GITHUB_ACTIONS=$3" VOC_CI_NO_NETWORK=1 \
              .venv/bin/python -m pytest -p no:cacheprovider -W error
          ' "$(id -un)" "$PATH" "$HOME" "$GITHUB_ACTIONS"

      # dbt build with its data tests on the committed synthetic fixture (SYN- IDs),
      # with usage stats off and in the same no-network namespace as the tests.
      - name: dbt build on the synthetic fixture with no network
        run: |
          sudo unshare --net -- sh -c '
            ip link set lo up &&
            sudo -u "$0" env "PATH=$1" "HOME=$2" DO_NOT_TRACK=1 DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS=False \
              .venv/bin/python scripts/dbt_fixture_build.py tests/fixtures/dbt/complaints.csv "$3"
          ' "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP/dbt-fixture"

  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.6.17"

      - name: Repo checks (names, raw data, size, unreadable files, whole history)
        env:
          NAMES_DENYLIST: ${{ secrets.NAMES_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run --locked python -m voc.repo_checks

      - name: The test run log only grows compared with main (B17)
        run: |
          base="$RUNNER_TEMP/test_runs_on_main.md"
          # Fail if main cannot be read at all, so a git error never counts as "nothing on main yet".
          git rev-parse --verify origin/main > /dev/null
          if git cat-file -e origin/main:runs/TEST_RUNS.md 2>/dev/null; then
            git show origin/main:runs/TEST_RUNS.md > "$base"
          else
            rm -f "$base"
          fi
          uv run --locked python scripts/check_test_runs.py "$base" runs/TEST_RUNS.md

      - name: The June run log only grows compared with main (spec 004, J1)
        run: |
          base="$RUNNER_TEMP/june_runs_on_main.md"
          # Fail if main cannot be read at all, so a git error never counts as "nothing on main yet".
          git rev-parse --verify origin/main > /dev/null
          if git cat-file -e origin/main:runs/JUNE_RUNS.md 2>/dev/null; then
            git show origin/main:runs/JUNE_RUNS.md > "$base"
          else
            rm -f "$base"
          fi
          uv run --locked python scripts/check_test_runs.py "$base" runs/JUNE_RUNS.md

      - name: The June gates log only grows compared with main (spec 004, J1)
        run: |
          base="$RUNNER_TEMP/june_gates_on_main.md"
          # Fail if main cannot be read at all, so a git error never counts as "nothing on main yet".
          git rev-parse --verify origin/main > /dev/null
          if git cat-file -e origin/main:runs/JUNE_GATES.md 2>/dev/null; then
            git show origin/main:runs/JUNE_GATES.md > "$base"
          else
            rm -f "$base"
          fi
          uv run --locked python scripts/check_test_runs.py "$base" runs/JUNE_GATES.md

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan of the full history (gitleaks v8.30.1)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
