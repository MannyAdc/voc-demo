# Spec 004, J9: the deploy of the receiver, the Azure Function in receiver/ (owner decisions, 6 and 7 November).
#
# The owner starts it by hand, on main, after the change to receiver/ is merged. Claude never starts it. It runs in
# the environment `receiver-deploy`, limited to main, and signs in to Azure with OpenID Connect as its own
# identity, which trusts only that environment's token. So the dashboard's deploy, which has another identity and
# no environment, cannot reach the receiver (J13). It packs only the receiver's own files and the commit, which the
# Flex Consumption plan builds remotely from requirements.txt. Then it checks that the live receiver refuses an
# unsigned call and names this commit. The app's names and its address are secrets, and the Azure CLI's error text
# is kept out of this public log: on a failure, the details are in the Azure portal.
name: Deploy the receiver

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-receiver
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: receiver-deploy
    timeout-minutes: 20
    steps:
      - name: Decide whether to deploy
        id: ready
        # A run with a secret unset fails, so it is never read as a deploy. A run whose commit is no longer the
        # tip of main stops, so a re-run of an old run can never roll the receiver back (as deploy.yml, review of
        # #56).
        env:
          CLIENT_ID: ${{ secrets.RECEIVER_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APP: ${{ secrets.RECEIVER_APP_NAME }}
          GROUP: ${{ secrets.RECEIVER_RESOURCE_GROUP }}
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ] || [ -z "$APP" ] || [ -z "$GROUP" ] || [ -z "$RECEIVER_URL" ]; then
            echo "The receiver's deploy secrets are not all set, so nothing was deployed."
            exit 1
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved on since this run's commit, so this run deploys nothing. Start a new run."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Check out main
        if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack the receiver's own files and the commit
        if: steps.ready.outputs.go == 'true'
        run: git archive --format=zip -o "$RUNNER_TEMP/receiver.zip" --add-virtual-file="BUILD_COMMIT:$GITHUB_SHA" HEAD:receiver function_app.py host.json requirements.txt receiver_core.py receiver_adapters.py

      - name: Sign in to Azure with OpenID Connect
        if: steps.ready.outputs.go == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.RECEIVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload the ZIP and build it remotely, printing only the exit code
        if: steps.ready.outputs.go == 'true'
        env:
          APP: ${{ secrets.RECEIVER_APP_NAME }}
          GROUP: ${{ secrets.RECEIVER_RESOURCE_GROUP }}
        run: |
          set +e
          az functionapp deployment source config-zip --name "$APP" --resource-group "$GROUP" --src "$RUNNER_TEMP/receiver.zip" --build-remote true -o none > /dev/null 2> /dev/null
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "The upload failed with exit code $code. The details are in the Azure portal, under the app's Deployment Center."
            exit 1
          fi

      - name: Check that the live receiver refuses an unsigned call and runs this commit
        if: steps.ready.outputs.go == 'true'
        # An empty POST to the result route has no timestamp or signature, so a working receiver answers 401 and
        # takes nothing. Every reply names its commit in X-Voc-Build, so an old instance that still answers does not
        # count. A cold start can be slow: 20 tries of at most 15 seconds, 15 seconds apart, up to 10 minutes.
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
        run: |
          for attempt in $(seq 1 20); do
            reply=$(curl --silent --output /dev/null --max-time 15 --data '' --write-out '%{http_code} %header{x-voc-build}' -X POST "$RECEIVER_URL/api/result") || reply="000 none"
            status=${reply%% *}
            build=${reply#* }
            if [ "$status" = "401" ] && [ "$build" = "$GITHUB_SHA" ]; then
              echo "The live receiver refuses an unsigned call and runs this commit."
              exit 0
            fi
            sleep 15
          done
          echo "The live receiver did not refuse an unsigned call with 401 from this commit within 10 minutes."
          exit 1
