[project]
name = "voc"
version = "0.1.0"
description = "Voice of the Customer labelling on CFPB complaints, where every label must quote its evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.13.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "scikit-learn==1.9.1",
]

[project.scripts]
voc = "voc.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
