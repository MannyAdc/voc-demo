[project]
name = "voc"
version = "0.1.0"
description = "Voice of the Customer labelling on CFPB complaints, where every label must quote its evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.13.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "fastapi==0.143.0",
    "scikit-learn==1.9.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.scripts]
voc = "voc.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "receiver"]
addopts = "-q"

[dependency-groups]
# A13: the public copy's runtime packages only, pinned as above. `requirements.txt` is exported from this group.
public = [
    "duckdb==1.5.6",
    "fastapi==0.143.0",
    # Loaded when the public app starts here, though no package above declares it, so it is pinned too.
    "sniffio==1.3.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]
databricks = [
    "dbt-databricks==1.13.0",
]
# Spec 004, J11: Job B's packages in the cloud, pinned as above. `cloud/job_b/requirements.txt` is compiled from
# this group with hashes for Databricks' Python, and Job B installs it before it imports the repo's code (6b).
cloud = [
    "anthropic==1.13.0",
    "scikit-learn==1.9.1",
]
dev = [
    "pytest>=9.1.1",
]
