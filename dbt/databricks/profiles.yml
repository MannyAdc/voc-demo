# T021: the Databricks target, for the synthetic seeds only. Run it only through
# `voc dbt build --target databricks`, which refuses unless every seeded complaint ID is SYN-.
# The connection comes from environment variables set by the owner for one run, never written here.
# The catalog defaults to `workspace`, the Free Edition catalog. dbt writes to its own schema.
voc:
  target: databricks
  outputs:
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: voc_synthetic
      threads: 1
