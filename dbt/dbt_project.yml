# The dbt project on the staged DuckDB table (T011, B14).
# Run it only through `voc dbt build` or `voc dbt docs`, which print counts and check names only (B21).
name: voc
version: "1.0.0"
config-version: 2
profile: voc

model-paths: ["models"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

vars:
  # The label set, passed by the wrapper from config/labels.toml (B24). Empty means every row fails.
  labels: []
  # B17: while this is false, the models leave out every complaint ID in splits/test.csv.
  # `voc dbt` always passes false. Only a person running dbt by hand can set it to true.
  final: false
  # The real monthly export on Databricks (owner decision, 31 October 2026). `voc dbt build --target databricks
  # --month <month>` passes the volume file, its pinned SHA-256 and, where recorded, its row count.
  month: ""
  month_file: ""
  month_sha256: ""
  month_rows: 0

# T021: on the Databricks target, two synthetic seeds stand in for the staged DuckDB table and for
# splits/test.csv. `scripts/databricks_fixture_build.py` writes them into a work folder, and `voc dbt build
# --target databricks` refuses unless every complaint ID is SYN-. One seed is in this repo, by owner decision of
# 5 November (spec 004): seeds/test_list.csv, a byte copy of splits/test.csv, for Job A's dbt task. `voc dbt
# build --target databricks` refuses in the project itself or inside a git checkout.
# They are off on the local DuckDB target.
seeds:
  voc:
    +enabled: "{{ target.type == 'databricks' }}"
    +quote_columns: false
    staged_complaints:
      # Off for a month build: the rows then come from the volume (models/landed_complaints.sql).
      +enabled: "{{ target.type == 'databricks' and var('month', '') == '' }}"
      +column_types:
        date_received: date
        date_sent_to_company: date
        timely_response: boolean
        complaint_id: string
        source: string
        product: string
        sub_product: string
        issue: string
        sub_issue: string
        narrative: string
        company_public_response: string
        company: string
        state: string
        zip_code: string
        tags: string
        submitted_via: string
        company_response: string
    test_list:
      +column_types:
        complaint_id: string
        content_hash: string
