# Spec 004, J7: the June claims, fixed before any June label is scored (J1). The June scoring code reads the
# threshold, the draws, the seed and `within` from here, and refuses any `within` but "Product". A test checks
# the model and the prompt against config/prompts/v1.toml, and Job B checks them again (pull request 6). They are
# not changed after the June entry in runs/JUNE_RUNS.md.
model = "claude-haiku-5-5"
prompt = "v1"
weights = "June's own pool after copies are removed, from splits/june/manifest.json"

[bootstrap]
resamples = 2000
seed = 0
within = "Product"

[primary]
claim = "the hybrid against the LLM alone, both at full coverage, as V6 scores it"
hybrid = "TF-IDF + LR answers at a top confidence of 0.9 or more, else the LLM. A held-back LLM label counts as wrong"
threshold = 0.9
beats = "the 95% interval of the point difference is wholly above zero"
does_not_beat = "the point difference is zero or below"
inconclusive = "otherwise"
# Owner decision, 5 November: when both tests above apply, "does not beat" wins.
rule = "a win needs both a point difference above zero and a 95% interval wholly above zero. When the point difference is zero or below, the verdict is does not beat, whatever the interval"

[secondary]
comparison = "the LLM against TF-IDF + LR at the same coverage, as B10 defines it, with its interval and no verdict"

[cost]
per_extra_correct = "against TF-IDF + LR at the same coverage, as V6's headline, with the full-coverage view next to it"
