# Prices per million tokens, in US dollars (B13). Every entry names its source and the date it was checked.
# A model missing here is an error, never zero cost.

[models.claude-haiku-5-5]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-10-28"
# The higher prices apply to a request whose prompt is over the threshold, counting all its input tokens.
long_context_threshold = 100000
input_per_mtok = "0.10"
output_per_mtok = "0.50"
long_input_per_mtok = "0.50"
long_output_per_mtok = "2.50"
