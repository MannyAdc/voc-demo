# B8: the token cap for all live model calls, input plus output tokens.
# Every change to this file is a visible commit. Live calls, `voc ledger init`
# and `voc ledger raise` are refused while this file has uncommitted changes.
# Init and raise read this file as committed on main, never from a branch.
# To raise the cap later, merge a higher value to main, then run
# `voc ledger raise --reason "..."` in this repo.
cap_tokens = 20000000

# Added to the UTF-8 byte count of a prompt to make the worst-case input estimate.
# It covers the tokens the API adds around the prompt. It was checked on
# 29 October 2026 by the second smoke test, with LLM_BACKEND=api and
# `voc label quick --limit 20`. The results are in
# results/labels/v1_quick_first20.json. In all 20 calls the real input tokens were
# below the byte count alone. The closest call was 1,750 tokens below. The check
# covers one model, claude-haiku-5-5. A new model needs its own check.
input_margin_tokens = 100

# The trial cap applies only while margin_confirmed is false. Then the effective
# cap is the smaller of cap_tokens and trial_cap_tokens. It was raised from 100,000
# on 29 October 2026 (owner decision). The first smoke test
# (`voc label quick --limit 20`, BUILD_LOG.md, 28 October 23:26) charged 99,469
# tokens. 5 complaints were each tried 3 times, so 15 calls failed. Each failed
# call was charged its full worst-case reservation. No call returned an answer.
trial_cap_tokens = 200000

# Set to true only in a commit on main. Then run `voc ledger raise --reason "..."`,
# which writes the event to the ledger. The effective cap becomes cap_tokens.
# Confirmed on 29 October 2026 (owner decision), after the check above.
margin_confirmed = true
